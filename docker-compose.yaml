services:
  bun:
    image: oven/bun:latest
    hostname: bun
    working_dir: /app
    command: sh -c "FORCE_COLOR=1 bun --watch index.ts"
    volumes:
      - ./:/app

  test:
    image: oven/bun:latest
    hostname: test
    working_dir: /app
    command: sh -c "FORCE_COLOR=1 bun test --watch ${EXERCICE:-exercices/}"
    volumes:
      - ./:/app

  check:
    image: oven/bun:latest
    working_dir: /app
    command: sh -c "bunx tsc --noEmit ${EXERCICE:+exercices/$EXERCICE/index.ts exercices/$EXERCICE/index.test.ts}"
    volumes:
      - ./:/app

  scaffold:
    image: oven/bun:latest
    working_dir: /app
    command: sh -c "bun scripts/scaffold.ts ${NAME}"
    volumes:
      - ./:/app
